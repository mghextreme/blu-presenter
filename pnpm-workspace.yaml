packages:
  - api
  - app
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  core-js: true
  core-js-pure: true
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAge: 0
overrides:
  brace-expansion@>=5.0.0 <5.0.6: '>=5.0.6'
  cookie@<0.7.0: '>=0.7.0'
  file-type@>=13.0.0 <21.3.1: '>=21.3.1'
  file-type@>=20.0.0 <=21.3.1: '>=21.3.2'
  ws@>=8.0.0 <8.20.1: '>=8.20.1'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vitest: 5.1.1
  vite-plus: 1.8.0
  '@vitest/ui': 5.1.1
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: '*'
