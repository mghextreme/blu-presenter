name: Build API and APP

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  lockfile-check:
    name: Verify workspace lockfile is in sync
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'pnpm'
        cache-dependency-path: ./pnpm-lock.yaml

    - name: Verify pnpm-lock.yaml matches package.json files
      # --frozen-lockfile fails if any package.json has specifiers not
      # reflected in pnpm-lock.yaml. Run from repo root so the workspace
      # lockfile is checked against api/ and app/ together.
      run: pnpm install --frozen-lockfile

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: lockfile-check

    steps:
    - uses: actions/checkout@v4

    - name: Set up pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'pnpm'
        cache-dependency-path: ./pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run tests
      run: pnpm --filter blu-presenter-api test

    - name: Build API
      run: pnpm --filter blu-presenter-api build

  build-app:
    name: Build App
    runs-on: ubuntu-latest
    needs: lockfile-check

    steps:
    - uses: actions/checkout@v4

    - name: Set up pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'pnpm'
        cache-dependency-path: ./pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run tests
      run: pnpm --filter blu-presenter-app test run

    - name: Build App
      run: pnpm --filter blu-presenter-app build
