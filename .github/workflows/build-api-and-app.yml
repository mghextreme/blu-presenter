name: Build API and APP

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Cancel superseded runs on the same PR/branch to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lockfile-check:
    name: Verify workspace lockfile is in sync
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.28.1

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'pnpm'
        cache-dependency-path: ./pnpm-lock.yaml

    - name: Verify pnpm-lock.yaml matches package.json files
      # --frozen-lockfile fails if any package.json has specifiers not
      # reflected in pnpm-lock.yaml. Run from repo root so the workspace
      # lockfile is checked against api/ and app/ together.
      run: pnpm install --frozen-lockfile

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: lockfile-check

    steps:
    - uses: actions/checkout@v6

    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.28.1

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'pnpm'
        cache-dependency-path: ./pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint API
      run: pnpm --filter blu-presenter-api lint

    - name: Run tests
      run: pnpm --filter blu-presenter-api test

    - name: Build API
      run: pnpm --filter blu-presenter-api build

  build-app:
    name: Build App
    runs-on: ubuntu-latest
    needs: lockfile-check

    steps:
    - uses: actions/checkout@v6

    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.28.1

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'pnpm'
        cache-dependency-path: ./pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint App
      run: pnpm --filter blu-presenter-app lint

    - name: Run tests
      run: pnpm --filter blu-presenter-app test run

    - name: Build App
      run: pnpm --filter blu-presenter-app build

  docker-build-api:
    name: Build API Docker image
    runs-on: ubuntu-latest
    needs: lockfile-check

    steps:
    - uses: actions/checkout@v6

    - name: Build API Docker image
      # Same image build as api-build-and-deploy.yml (without the ECR push).
      # The container install runs with only the workspace manifests copied
      # into the context, so it validates things a full checkout cannot:
      # .dockerignore vs the manifests, and that pnpm-lock.yaml's importers
      # all resolve against the copied package.json files (pnpm >= 11.28
      # fails "frozen-lockfile" if any importer's manifest is missing).
      run: docker build -f api/Dockerfile . -t blu-presenter-api:ci
